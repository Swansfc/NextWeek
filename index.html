    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#0b0f17">
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #121824;
            --card-hover: #1a2233;
            --accent: #ff3b30;
            --text-main: #ffffff;
            --text-muted: #9a9aae;
            --border: #2c2c3a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background-color: var(--bg-color); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .logo-area { display: flex; align-items: center; cursor: pointer; }
        .brand-text-logo { font-size: 30px; font-weight: 800; font-style: italic; letter-spacing: -0.5px; display: flex; align-items: baseline; line-height: 1; }
        .brand-text-next { color: #ffffff; }
        .brand-text-week { color: var(--accent); }
        .header-actions { display: flex; gap: 8px; }
        .search-btn { background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); width: 46px; height: 46px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .search-btn:hover, .search-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255, 59, 48, 0.1); }
        .container { max-width: 650px; margin: 0 auto; padding: 20px 16px; }
        .week-nav { display: flex; justify-content: space-between; align-items: center; background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 20px; }
        .week-nav-title { font-size: 14px; font-weight: 600; }
        .nav-arrow-btn { background: rgba(255, 59, 48, 0.12); border: 1px solid rgba(255, 59, 48, 0.5); color: var(--accent); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; }
        .nav-arrow-btn:hover, .nav-arrow-btn:active { background: var(--accent); border-color: var(--accent); color: #fff; }
        #search-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(11, 15, 23, 0.95); backdrop-filter: blur(12px); z-index: 200; display: none; flex-direction: column; padding: 20px; align-items: center; justify-content: flex-start; }
        .search-content-wrapper { max-width: 650px; width: 100%; display: flex; flex-direction: column; height: 100%; }
        .search-tabs-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .search-tab-btn { flex: 1; background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 10px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; }
        .search-tab-btn:hover { border-color: var(--accent); color: var(--text-main); }
        .search-tab-btn.active { background: rgba(255, 59, 48, 0.15); border-color: var(--accent); color: var(--accent); }
        .search-header-row { display: flex; gap: 12px; align-items: center; width: 100%; margin-bottom: 12px; }
        #modal-search-input { flex: 1; padding: 14px 18px; background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; color: var(--text-main); outline: none; font-size: 16px; }
        .close-search-btn { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 8px; }
        
        .league-chips-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; width: 100%; max-height: 110px; overflow-y: auto; padding-bottom: 4px; }
        .league-chip { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .league-chip:hover, .league-chip.active { background: rgba(255, 59, 48, 0.15); border-color: var(--accent); color: var(--accent); }

        .search-results-box { width: 100%; overflow-y: auto; flex: 1; padding-bottom: 40px; }
        .day-card, .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .day-card { scroll-margin-top: 84px; display: block; transition: border-color 0.2s; }
        .day-card.is-today { border-color: rgba(255, 59, 48, 0.6); }
        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .day-title { font-size: 15px; font-weight: 700; }
        .today-badge { background: var(--accent); color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-left: 8px; }
        .day-date { font-size: 12px; color: var(--text-muted); margin-left: 8px; }
        .action-btn { background: var(--card-hover); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; min-width: 36px; height: 36px; }
        .action-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(255, 59, 48, 0.1); }
        .action-btn .ico { width: 18px; height: 18px; margin: 0; vertical-align: middle; pointer-events: none; }
        .action-btn.added { background: var(--accent); border-color: var(--accent); color: #fff; }
        .action-btn.added:hover { background: var(--accent); color: #fff; }
        .item { background-color: #161f30; border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; align-items: flex-start; justify-content: space-between; margin-top: 8px; user-select: none; position: relative; }
        .item-content { flex: 1; }
        .menu-container { position: relative; margin-left: 8px; }
        .menu-dots-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
        .menu-dots-btn:hover { color: var(--text-main); }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 24px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); z-index: 50; width: 190px; overflow: hidden; }
        .dropdown-menu.show { display: block; }
        .dropdown-item { padding: 10px 12px; font-size: 13px; color: var(--text-main); background: none; border: none; width: 100%; text-align: left; display: block; border-bottom: 1px solid var(--border); cursor: pointer; }
        .dropdown-item:last-child { border-bottom: none; color: var(--accent); }
        .dropdown-item:hover { background: var(--card-hover); }
        .dropdown-date-input { display: none; width: calc(100% - 20px); margin: 6px 10px 10px 10px; padding: 6px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 6px; color: white; font-size: 12px; outline: none; }
        .dropdown-date-input.show { display: block; }
        .sub-days-menu { display: none; background: var(--card-hover); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .sub-days-menu.show { display: block; }
        .sub-day-btn { padding: 8px 16px; font-size: 12px; color: var(--text-muted); background: none; border: none; width: 100%; text-align: left; cursor: pointer; display: block; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sub-day-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
        .badge { background: rgba(255, 59, 48, 0.2); color: #ff6b63; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
        .empty-day { color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0; font-style: italic; }
        .lk { color: var(--accent); cursor: pointer; text-decoration: none; border: none; background: none; font-size: 14px; text-align: left; padding: 0; }
        .lk:hover { text-decoration: underline; }
        .item { -webkit-touch-callout: none; -webkit-user-select: none; }
        .item.dragging { opacity: 0.25; }
        .drag-ghost { position: fixed; z-index: 1000; pointer-events: none; opacity: 0.92; transform: scale(1.03); box-shadow: 0 12px 28px rgba(0,0,0,0.6); border-color: var(--accent); margin: 0; }
        .item.drop-before { box-shadow: 0 -3px 0 var(--accent); }
        .item.drop-after { box-shadow: 0 3px 0 var(--accent); }
        .day-card.drop-target { border-color: var(--accent); background: rgba(255, 59, 48, 0.08); }
        .ico { width: 1.4em; height: 1.4em; vertical-align: -0.18em; margin-right: 4px; flex-shrink: 0; }
        .ico .l { fill: none; stroke: var(--text-muted); }
        .ico .r { fill: var(--accent); stroke: var(--accent); }
        .search-btn .ico { width: 30px; height: 30px; margin: 0; vertical-align: middle; }
        .search-tab-btn .ico { width: 28px; height: 28px; margin: 0; }
        .league-row .ico, .league-schedule-row .ico { width: 30px; height: 30px; margin: 0; }
        .search-click-sport-team .ico, .search-click-league .ico { width: 28px; height: 28px; margin: 0; }
        details.season { margin-bottom: 4px; }
        details.season > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; -webkit-tap-highlight-color: transparent; }
        details.season > summary::-webkit-details-marker { display: none; }
        details.season > summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--text-muted); border-bottom: 2px solid var(--text-muted); transform: rotate(45deg); transition: transform 0.2s; margin: 0 4px 3px 8px; }
        details.season[open] > summary::after { transform: rotate(-135deg); margin-bottom: -3px; }
        .season-count { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: none; }
        details.season > .card:first-of-type { margin-top: 12px; }
        h3 { margin: 16px 0 6px; font-size: 13px; color: var(--text-muted); text-transform: uppercase; }
        .round-header { font-size: 14px; font-weight: 700; color: var(--accent); margin: 16px 0 8px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area" id="home-logo-btn">
            <div class="brand-text-logo"><span class="brand-text-next">Next</span><span class="brand-text-week">Week</span></div>
        </div>
        <div class="header-actions">
            <button class="search-btn" id="search-tv-btn" title="Sök Serier">📺</button>
            <button class="search-btn" id="search-movie-btn" title="Sök Filmer">🎬</button>
            <button class="search-btn" id="search-sport-btn" title="Sök Sport">⚽</button>
        </div>
    </header>

    <div id="search-modal">
        <div class="search-content-wrapper" id="search-content-wrapper">
            <div class="search-tabs-row">
                <button class="search-tab-btn active" data-tab="tv">📺 Serier</button>
                <button class="search-tab-btn" data-tab="movie">🎬 Filmer</button>
                <button class="search-tab-btn" data-tab="sport">⚽ Sport</button>
            </div>
            <div class="search-header-row">
                <input type="text" id="modal-search-input" placeholder="Sök serie..." autofocus>

                const name = label(x).replace(/</g, '&lt;') + (x.year ? ' (' + x.year + ')' : '');
                const cls = tab === 'tv' ? 'search-click-show' : 'search-click-movie';
                const icon = tab === 'tv' ? ICON_TV : ICON_FILM;
                return `<div class="card ${cls}" data-id="${x.id}" style="cursor:pointer;"><span>${icon} ${name}</span><span style="color:var(--text-muted);">›</span></div>`;
            }).join('');
        }

        function renderFavorites() {
            const box = document.getElementById('modal-search-results');
            const lg = favorites.leagues.map(id => LEAGUES.findIndex(l => l.id === id)).filter(i => i >= 0)
                .sort((a, b) => LEAGUES[a].name.localeCompare(LEAGUES[b].name, 'sv'));
            const tm = [...favorites.teams].sort((a, b) => (a.strTeam || '').localeCompare(b.strTeam || '', 'sv'));
            if (!lg.length && !tm.length) { box.innerHTML = ''; return; }
            box.innerHTML = `<h3 style="margin:4px 0 8px;">Favoriter</h3>` + lg.map(i => leagueCardHtml(LEAGUES[i], i)).join('') + tm.map(teamCardHtml).join('');
        }

        function teamCardHtml(t) {
            const teamName = (t.strTeam || '').replace(/"/g, '&quot;');
            const sport = kindFromSport(t.strSport);
            const league = leagueSv(t.strLeague);
            const teamJson = encodeURIComponent(JSON.stringify({ idTeam: t.idTeam, strTeam: t.strTeam, strLeague: t.strLeague, strSport: t.strSport, leagueIdx: t.leagueIdx }));
            return `<div class="card search-click-sport-team" data-team-obj="${teamJson}" style="cursor:pointer;"><span style="display:flex; align-items:center; gap:12px;">${iconFromSport(t.strSport)}<span><b>${teamName}</b><br><small style="color:var(--text-muted);">${sport}${league ? ' · ' + league : ''}</small></span></span><span style="color:var(--text-muted);">›</span></div>`;
        }

        const SE_TZ = 'Europe/Stockholm';
        function addDays(dateStr, n) { const x = parseDate(dateStr); x.setDate(x.getDate() + n); return formatDateStr(x); }
        function kindFromSport(sp) {
            const x = (sp || '').toLowerCase();
            if (x.includes('soccer')) return 'Fotboll';
            if (x.includes('basket')) return 'Basket';
            if (x.includes('hockey')) return 'Ishockey';
            if (x.includes('american')) return 'Amerikansk fotboll';
            if (x.includes('motor')) return 'F1';
            return 'Sport';
        }
        function leagueSv(name) {
            const map = {
                'english premier league': 'Premier League', 'swedish allsvenskan': 'Allsvenskan',
                'spanish la liga': 'La Liga', 'italian serie a': 'Serie A', 'german bundesliga': 'Bundesliga',
                'formula 1': 'F1', 'formula one': 'F1'
            };
            const n = (name || '').trim();
            return map[n.toLowerCase()] || n;
        }
        function iconFromSport(sp) {
            const k = kindFromSport(sp);
            return k === 'Basket' ? ICON_BASKET : k === 'Ishockey' ? ICON_PUCK : k === 'Amerikansk fotboll' ? ICON_NFL : k === 'F1' ? ICON_F1 : ICON_SPORT;
        }
        const LEAGUE_ALIASES = {
            'Premier League': 'football soccer fotboll england engelska',
            'Allsvenskan': 'football soccer fotboll sverige svenska',
            'La Liga': 'football soccer fotboll spanien spanska',
            'Serie A': 'football soccer fotboll italien italienska',
            'Bundesliga': 'football soccer fotboll tyskland tyska',
            'NBA': 'basketball basket',
            'NHL': 'hockey ishockey',
            'NFL': 'american football amerikansk fotboll',
            'F1': 'formel 1 formula 1 motorsport racing',
            'Championship': 'football soccer fotboll england engelska efl andra divisionen',
            'Champions League': 'football soccer fotboll europa uefa cl mästarnas liga'
        };
        function matchLeagues(q) {
            q = q.toLowerCase();
            return LEAGUES.map((l, i) => ({ l, i })).filter(({ l }) => `${l.name} ${l.api} ${l.kind} ${LEAGUE_ALIASES[l.name] || ''}`.toLowerCase().includes(q));
        }
        function leagueCardHtml(l, i) {
            return `<div class="card search-click-league" data-idx="${i}" style="cursor:pointer;"><span style="display:flex; align-items:center; gap:12px;">${l.icon}<span><b>${l.name}</b><br><small style="color:var(--text-muted);">${l.kind} · Liga</small></span></span><span style="color:var(--text-muted);">›</span></div>`;
        }
        // ---------- ESPN (lag, spelscheman, F1) ----------
        const ESPN = 'https://site.api.espn.com/apis/site/v2/sports';
        // ESPN tillåter inte alltid anrop direkt från webbläsaren (CORS) – prova då via publika proxyn
        // Klistra in adressen till din egen Cloudflare Worker här (se espn-proxy-worker.js), t.ex. 'https://espn.dittnamn.workers.dev'
        const ESPN_PROXY = 'https://espn.swansfc82.workers.dev';
        const ESPN_ROUTES = [
            ...(ESPN_PROXY ? [u => `${ESPN_PROXY}?url=${encodeURIComponent(u)}`] : []),
            u => u,
            u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
            u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
        ];
        let espnRoute = 0;
        async function espnFetchJson(url) {
            let last = new Error('nätverksfel');
            const order = [espnRoute, ...ESPN_ROUTES.map((_, i) => i).filter(i => i !== espnRoute)];
            for (const i of order) {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 7000);
                try {
                    const r = await fetch(ESPN_ROUTES[i](url), { signal: ctrl.signal });
                    if (r.status === 404 || r.status === 400) throw Object.assign(new Error('HTTP ' + r.status), { definitive: true });
                    if (!r.ok) { last = new Error('HTTP ' + r.status); continue; }
                    const j = await r.json();
                    espnRoute = i;
                    return j;
                } catch (e) {
                    if (e && e.definitive) throw e;
                    last = (e && e.name === 'AbortError') ? new Error('för långsamt svar') : e;
                }
                finally { clearTimeout(timer); }
            }
            throw last;
        }
        function espnDate(str) { return str.replace(/-/g, ''); }
        function tsInfo(iso) {
            const dt = new Date(iso);
            if (isNaN(dt)) return { ts: 0, d: '', t: '' };
            return {
                ts: dt.getTime(),
                d: dt.toLocaleDateString('sv-SE', { timeZone: SE_TZ }),
                t: dt.toLocaleTimeString('sv-SE', { timeZone: SE_TZ, hour: '2-digit', minute: '2-digit' })
            };
        }
        function espnEvent(ev) {
            const comp = (ev.competitions && ev.competitions[0]) || {};
            const cs = comp.competitors || [];
            const nm = c => c && c.team && (c.team.displayName || c.team.name);
            const home = cs.find(c => c.homeAway === 'home'), away = cs.find(c => c.homeAway === 'away');
            const title = nm(home) && nm(away) ? `${nm(home)} – ${nm(away)}` : (ev.name || ev.shortName || 'Match');
            return Object.assign(tsInfo(ev.date || comp.date), {
                title,
                teamIds: cs.map(c => String((c.team && c.team.id) || c.id))
            });
        }
        const isUpcoming = e => e.ts > Date.now() && e.d;

        async function espnScoreboard(path, fromDay, toDay, limit) {
            let q = '';
            if (toDay !== null) q = `?dates=${espnDate(addDays(todaySE(), fromDay))}-${espnDate(addDays(todaySE(), toDay))}${limit ? '&limit=' + limit : ''}`;
            const j = await espnFetchJson(`${ESPN}/${path}/scoreboard${q}`);
            return (j.events || []).map(espnEvent);
        }

        // Lagens schema (används även för att bygga ligans schema om scoreboard saknas)
        async function espnTeamSchedule(l, teamId, path = l.espn, label = l.name) {
            const j = await espnFetchJson(`${ESPN}/${path}/teams/${teamId}/schedule${l.kind === 'Fotboll' ? '?fixture=true' : ''}`);
            return (j.events || []).map(espnEvent).filter(isUpcoming).map(e => Object.assign(e, { comp: label }));
        }

        // Övriga turneringar som fotbollslag kan spela i (ignoreras om laget inte är med)
        const EUROPE_COMPS = [['uefa.champions', 'Champions League'], ['uefa.europa', 'Europa League'], ['uefa.europa.conf', 'Conference League']];
        const DOMESTIC_CUPS = {
            'soccer/eng.1': [['eng.fa', 'FA-cupen'], ['eng.league_cup', 'Ligacupen']],
            'soccer/eng.2': [['eng.fa', 'FA-cupen'], ['eng.league_cup', 'Ligacupen']],
            'soccer/esp.1': [['esp.copa_del_rey', 'Copa del Rey']],
            'soccer/ita.1': [['ita.coppa_italia', 'Coppa Italia']],
            'soccer/ger.1': [['ger.dfb_pokal', 'DFB-Pokal']],
            'soccer/swe.1': [['swe.svenska_cupen', 'Svenska cupen']]
        };

        // Kommande matcher i en liga (de närmaste) – flera vägar om en inte ger något
        async function fetchLeagueMatches(l) {
            let lastErr = null;
            const attempts = [
                () => espnScoreboard(l.espn, 0, 21, 300),
                () => espnScoreboard(l.espn, 0, 60, 0),
                () => espnScoreboard(l.espn, 0, null, 0),
                async () => {
                    const idx = LEAGUES.indexOf(l);
                    const teams = (await loadAllTeams()).filter(t => t.leagueIdx === idx);
                    const res = await Promise.allSettled(teams.map(t => espnTeamSchedule(l, t.idTeam)));
                    const seen = new Set();
                    return res.flatMap(r => r.status === 'fulfilled' ? r.value : []).filter(e => {
                        const k = e.title + '|' + e.ts;
                        if (seen.has(k)) return false;
                        seen.add(k);
                        return true;
                    });
                }
            ];
            for (const attempt of attempts) {
                try {
                    const list = (await attempt()).filter(isUpcoming).sort((x, y) => x.ts - y.ts);
                    if (list.length) return list.slice(0, 40);
                } catch (e) { lastErr = e; }
            }
            if (lastErr) throw lastErr;
            return [];
        }

        // F1: alla kommande kval och lopp under säsongen (inte träning/sprint)
        async function fetchF1(l) {
            const year = todaySE().slice(0, 4);
            const get = async q => { try { return (await espnFetchJson(`${ESPN}/${l.espn}/scoreboard${q}`)).events || []; } catch (e) { return []; } };
            let evs = await get(`?dates=${year}`);
            if (!evs.length) evs = await get('');
            const out = [];
            evs.forEach(ev => {
                const comps = ev.competitions || [];
                let found = false;
                comps.forEach(c => {
                    const txt = (c.type && (c.type.text || c.type.abbreviation || c.type.name)) || '';
                    if (/sprint/i.test(txt)) return;
                    const isQual = /qual/i.test(txt);
                    const isRace = /race/i.test(txt);
                    if (!isQual && !isRace) return;
                    found = true;
                    const info = tsInfo(c.date || ev.date);
                    if (info.ts > Date.now()) out.push(Object.assign(info, { title: `${ev.name || ev.shortName} – ${isQual ? 'Kval' : 'Lopp'}` }));
                });
                if (!found && !comps.some(c => c.type)) {
                    const info = tsInfo(ev.date);
                    if (info.ts > Date.now()) out.push(Object.assign(info, { title: `${ev.name} – Lopp` }));
                }
            });
            return out.sort((x, y) => x.ts - y.ts);
        }

        // Kommande matcher för ett lag
        async function fetchTeamMatches(team) {
            const l = LEAGUES[team.leagueIdx];
            if (!l) return [];
            // turneringar först så att Champions League-matcher får rätt etikett, hemmaligan sist
            const comps = [];
            if (l.kind === 'Fotboll') {
                EUROPE_COMPS.forEach(c => { if (`soccer/${c[0]}` !== l.espn) comps.push([`soccer/${c[0]}`, c[1]]); });
                (DOMESTIC_CUPS[l.espn] || []).forEach(c => comps.push([`soccer/${c[0]}`, c[1]]));
            }
            comps.push([l.espn, l.name]);
            const res = await Promise.allSettled(comps.map(([path, label]) => espnTeamSchedule(l, team.idTeam, path, label)));
            const seen = new Set();
            let list = res.flatMap(r => r.status === 'fulfilled' ? r.value : []).filter(e => {
                const k = e.title + '|' + e.ts;
                if (seen.has(k)) return false;
                seen.add(k);
                return true;
            });
            if (!list.length) {
                try {
                    list = (await espnScoreboard(l.espn, 0, 120, 1000)).filter(e => isUpcoming(e) && e.teamIds.includes(String(team.idTeam)))
                        .map(e => Object.assign(e, { comp: l.name }));
                } catch (e) {}
            }
            return list.sort((x, y) => x.ts - y.ts).slice(0, 12);
        }

        // Alla lag i dina ligor (hämtas en gång) så att sökningen hittar alla
        let allTeams = null;
        async function fetchLeagueTeams(l, i) {
            const urls = [`${ESPN}/${l.espn}/teams`, `${ESPN}/${l.espn}/teams?limit=100`];
            let lastErr = '';
            for (const u of urls) {
                try {
                    const j = await espnFetchJson(u);
                    const lg = j && j.sports && j.sports[0] && j.sports[0].leagues && j.sports[0].leagues[0];
                    const arr = (lg && lg.teams) || j.teams || [];
                    const teams = arr.map(x => x.team || x).filter(t => t && t.id).map(t => ({
                        idTeam: String(t.id), strTeam: t.displayName || t.name, strLeague: l.name, strSport: l.sportEn, leagueIdx: i
                    }));
                    if (teams.length) return teams;
                    lastErr = 'tomt svar';
                } catch (e) { lastErr = (e && e.message) || 'nätverksfel'; break; }
            }
            throw new Error(`${l.name}: ${lastErr}`);
        }
        let teamsPromise = null, teamsFailAt = 0, teamsFailMsg = '';
        async function loadAllTeams() {
            if (allTeams) return allTeams;
            if (teamsFailAt && Date.now() - teamsFailAt < 30000) throw new Error(teamsFailMsg);
            if (!teamsPromise) {
                teamsPromise = (async () => {
                    const idxs = LEAGUES.map((l, i) => i).filter(i => !LEAGUES[i].f1);
                    // första ligan avgör vilken väg (direkt/proxy) som fungerar
                    const first = await fetchLeagueTeams(LEAGUES[idxs[0]], idxs[0]);
                    const rest = await Promise.allSettled(idxs.slice(1).map(i => fetchLeagueTeams(LEAGUES[i], i)));
                    let teams = first.concat(rest.flatMap(r => r.status === 'fulfilled' ? r.value : []));
                    const cl = LEAGUES.findIndex(l => l.dupe);
                    const inOther = new Set(teams.filter(t => t.leagueIdx !== cl).map(t => t.idTeam));
                    teams = teams.filter(t => t.leagueIdx !== cl || !inOther.has(t.idTeam));
                    allTeams = teams;
                    return teams;
                })().catch(e => { teamsFailAt = Date.now(); teamsFailMsg = e.message; throw e; })
                  .finally(() => { teamsPromise = null; });
            }
            return teamsPromise;
        }
        const normText = x => (x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        // Gemensam lista med matchkort (4 första + "Visa fler")
        // Var matcherna visas i Sverige säsongen 2026/27 (ändra här om rättigheterna byter ägare)
        const SE_BROADCASTERS = {
            'Premier League': 'Viaplay', 'Champions League': 'Viaplay', 'Bundesliga': 'Viaplay',
            'Europa League': 'Disney+', 'Conference League': 'Disney+', 'La Liga': 'Disney+',
            'Allsvenskan': 'TV4 Play', 'Serie A': 'TV4 Play',
            'NBA': 'HBO Max', 'NHL': 'Viaplay', 'NFL': 'DAZN', 'F1': 'Viaplay'
        };
        function sportEventsHtml(events, shown, kind, subName) {
            let html = '', lastDay = null;
            events.slice(0, shown).forEach(ev => {
                if (ev.d !== lastDay) {
                    lastDay = ev.d;
                    const label = new Date(ev.d + 'T12:00:00').toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'short' });
                    html += `<h3>${label}</h3>`;
                }
                const title = ev.title.replace(/"/g, '&quot;');
                const isAdded = cal.some(i => i.t === ev.title && i.d === ev.d);
                html += `
                    <div class="card">
                        <div>
                            <div style="font-size:14px; font-weight:600;">${ev.title}</div>
                            <small style="color:var(--text-muted);">${ev.t || 'Tid saknas'}${(ev.comp || subName) ? ' · ' + (ev.comp || subName) : ''}${SE_BROADCASTERS[ev.comp || subName] ? ' · ' + SE_BROADCASTERS[ev.comp || subName] : ''}</small>
                        </div>
                        <button class="action-btn add-cal-btn ${isAdded ? 'added' : ''}" data-title="${title}" data-sub="${SE_BROADCASTERS[ev.comp || subName] || ev.comp || subName}${ev.t ? ' · ' + ev.t : ''}" data-kind="${kind}" data-date="${ev.d}">${isAdded ? ICON_CHECK : ICON_PLUS}</button>
                    </div>`;
            });
            if (events.length > shown) html += `<button class="action-btn show-more-sport" style="width:100%; height:42px; font-weight:600;">Visa fler matcher</button>`;
            return html;
        }

        async function openSchedule(l) {
            document.getElementById('search-modal').style.display = 'none';
            selectedShow = null; selectedMovie = null; selectedSportTeam = null;
            sportShown = 4;
            document.getElementById('main-container').innerHTML = searchMsg(l.f1 ? 'Hämtar tävlingar...' : 'Hämtar spelschema...');
            let events = [], failed = false, failMsg = '';
            try { events = l.f1 ? await fetchF1(l) : await fetchLeagueMatches(l); } catch (e) { failed = true; failMsg = (e && e.message) || ''; }
            selectedSchedule = { league: l, events, failed, failMsg };
            render();
            window.scrollTo(0, 0);
        }

        function searchMsg(text) {
            return `<div style="color: var(--text-muted); text-align: center; padding-top: 40px;">${text}</div>`;
        }

        function openSearchModal(tab) {
            activeSearchTab = tab;
            document.querySelectorAll('.search-tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tab);
            });
            const input = document.getElementById('modal-search-input');
            const footer = document.getElementById('search-footer-info');
            const chipsBox = document.getElementById('league-chips-container');

            if (tab === 'tv') {
                input.placeholder = 'Sök serie';
                footer.textContent = 'Serier: TVmaze';
                chipsBox.style.display = 'none';
            } else if (tab === 'movie') {
                input.placeholder = 'Sök film';
                footer.textContent = 'Filmer: TMDB';
                chipsBox.style.display = 'none';
            } else if (tab === 'sport') {
                input.placeholder = 'Sök lag eller sport';
                footer.textContent = 'Sport: ESPN';
                chipsBox.style.display = 'none';
            }
            document.getElementById('search-modal').style.display = 'flex';
            input.value = '';
            document.getElementById('modal-search-results').innerHTML = '';
            renderEmptyState(tab);
            input.focus();
        }

        document.getElementById('search-tv-btn').addEventListener('click', () => openSearchModal('tv'));
        document.getElementById('search-movie-btn').addEventListener('click', () => openSearchModal('movie'));
        document.getElementById('search-sport-btn').addEventListener('click', () => openSearchModal('sport'));

        document.querySelectorAll('.search-tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                openSearchModal(btn.dataset.tab);
            });
        });

        document.getElementById('modal-search-input').addEventListener('input', function() {
            const query = this.value.trim();
            const resultsBox = document.getElementById('modal-search-results');
            clearTimeout(searchTimer);
            if (!query) {
                resultsBox.innerHTML = '';
                renderEmptyState(activeSearchTab);
                return;
            }
            resultsBox.innerHTML = searchMsg('Söker...');
            searchTimer = setTimeout(() => executeSearch(query, activeSearchTab), 300);
        });

        async function executeSearch(query, tab) {
            const resultsBox = document.getElementById('modal-search-results');
            try {
                if (tab === 'tv') {
                    const res = await fetch(`${TVMAZE}/search/shows?q=${encodeURIComponent(query)}`);
                    const shows = await res.json();
                    if (!shows.length) { resultsBox.innerHTML = searchMsg('Inga serier hittades.'); return; }
                    resultsBox.innerHTML = shows.slice(0, 6).map(s => {
                        const year = s.show.premiered ? s.show.premiered.slice(0, 4) : '';
                        return `<div class="card search-click-show" data-id="${s.show.id}" style="cursor:pointer;"><span>${ICON_TV} ${s.show.name}${year ? ' (' + year + ')' : ''}</span><span style="color:var(--text-muted);">›</span></div>`;
                    }).join('');
                } else if (tab === 'movie') {
                    if (!TMDB_KEY) { resultsBox.innerHTML = searchMsg('TMDB-nyckel saknas.'); return; }
                    const url = `https://api.themoviedb.org/3/search/movie?language=sv-SE&query=${encodeURIComponent(query)}&include_adult=false&api_key=${encodeURIComponent(TMDB_KEY)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    const movies = data.results || [];
                    if (!movies.length) { resultsBox.innerHTML = searchMsg('Inga filmer hittades.'); return; }
                    resultsBox.innerHTML = movies.slice(0, 6).map(m => {
                        const year = m.release_date ? m.release_date.slice(0, 4) : '';
                        const title = (m.title || '').replace(/</g, '&lt;');
                        return `<div class="card search-click-movie" data-id="${m.id}" style="cursor:pointer;"><span>${ICON_FILM} ${title}${year ? ' (' + year + ')' : ''}</span><span style="color:var(--text-muted);">›</span></div>`;
                    }).join('');
                } else if (tab === 'sport') {
                    const seq = ++sportSearchSeq;
                    const note = (txt, red) => `<div style="color: ${red ? 'var(--accent)' : 'var(--text-muted)'}; text-align: center; padding: 12px 0; font-size: 13px;">${txt}</div>`;
                    const leagueHtml = matchLeagues(query).map(({ l, i }) => leagueCardHtml(l, i)).join('');
                    // ligorna visas direkt, lagen läggs till när de är hämtade
                    resultsBox.innerHTML = leagueHtml + note('Söker lag...');
                    let teamsHtml = '', err = '';
                    try {
                        const q = normText(query);
                        const teams = (await loadAllTeams()).filter(t => normText(t.strTeam).includes(q))
                            .sort((x, y) => (x.strTeam || '').localeCompare(y.strTeam || '', 'sv'));
                        teamsHtml = teams.slice(0, 15).map(teamCardHtml).join('');
                    } catch (e) {
                        err = (e && e.message) || 'okänt fel';
                    }
                    if (seq !== sportSearchSeq) return;
                    resultsBox.innerHTML = leagueHtml + teamsHtml + (err ? note(`Kunde inte hämta lag (${err}).`, true) : '')
                        + ((!leagueHtml && !teamsHtml && !err) ? searchMsg('Inga träffar hittades.') : '');
                }
            } catch (err) {
                resultsBox.innerHTML = searchMsg('Ett fel uppstod vid sökningen.');
            }
        }

        function tmdbFetch(path, params = '') {
            const url = `https://api.themoviedb.org/3${path}?language=sv-SE${params}&api_key=` + encodeURIComponent(TMDB_KEY);
            return fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
        }

        document.addEventListener('click', async e => {
            const target = e.target;
            const modal = document.getElementById('search-modal');

            if (!target.closest('.menu-container') && !target.classList.contains('dropdown-date-input')) {
                document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            }
            if (modal.style.display === 'flex' && e.target === modal) {
                modal.style.display = 'none';
                return;
            }

            if (target.id === 'home-logo-btn' || target.closest('#home-logo-btn')) {
                currentTab = 'vecka';
                selectedShow = null;
                selectedMovie = null;
                selectedSportTeam = null, selectedSchedule = null;
                render();
            } else if (target.classList.contains('menu-dots-btn')) {
                e.stopPropagation();
                const menuId = target.dataset.menuId;
                const menu = document.getElementById(`menu-${menuId}`);
                document.querySelectorAll('.dropdown-menu').forEach(m => { if (m !== menu) m.classList.remove('show'); });
                menu.classList.toggle('show');
            } else if (target.classList.contains('move-tomorrow')) {
                const id = Number(target.dataset.id);
                const item = cal.find(i => i.id === id);
                if (item) { let d = parseDate(item.d); d.setDate(d.getDate() + 1); item.d = formatDateStr(d); render(); }
            } else if (target.classList.contains('move-next-week')) {
                const id = Number(target.dataset.id);
                const item = cal.find(i => i.id === id);
                if (item) { let d = parseDate(item.d); d.setDate(d.getDate() + 7); item.d = formatDateStr(d); render(); }
            } else if (target.classList.contains('trigger-move-menu')) {
                e.stopPropagation();
                document.getElementById(`sub-days-${target.dataset.id}`).classList.toggle('show');
            } else if (target.classList.contains('move-to-specific-date')) {
                const id = Number(target.dataset.id);
                const item = cal.find(i => i.id === id);
                if (item && target.dataset.date) { item.d = target.dataset.date; render(); }
            } else if (target.classList.contains('trigger-date-picker')) {
                e.stopPropagation();
                const dateInput = document.getElementById(`date-input-${target.dataset.id}`);
                dateInput.classList.toggle('show');
                dateInput.focus();
            } else if (target.classList.contains('remove-item')) {
                cal = cal.filter(item => item.id !== Number(target.dataset.id));
                render();
            } else if (target.id === 'prev-week-btn') {
                currentWeekStart.setDate(currentWeekStart.getDate() - 7); render();
            } else if (target.id === 'next-week-btn') {
                currentWeekStart.setDate(currentWeekStart.getDate() + 7); render();
            } else if (target.id === 'close-search-modal') {
                modal.style.display = 'none';
            } else if (target.closest('.search-click-show')) {
                const showId = target.closest('.search-click-show').dataset.id;
                document.getElementById('modal-search-results').innerHTML = searchMsg('Hämtar serie...');
                try {
                    const [res, epRes] = await Promise.all([
                        fetch(`${TVMAZE}/shows/${showId}`),
                        fetch(`${TVMAZE}/shows/${showId}/episodes`)
                    ]);
                    if (!res.ok || !epRes.ok) throw new Error('HTTP');
                    selectedShow = await res.json();
                    showEpisodes = await epRes.json();
                    selectedMovie = null; selectedSportTeam = null, selectedSchedule = null;
                    modal.style.display = 'none'; render();
                } catch (err) {
                    document.getElementById('modal-search-results').innerHTML = searchMsg('Kunde inte hämta seriedata.');
                }
            } else if (target.closest('.search-click-movie')) {
                const id = target.closest('.search-click-movie').dataset.id;
                document.getElementById('modal-search-results').innerHTML = searchMsg('Hämtar film...');
                try {
                    const [d, p] = await Promise.all([
                        tmdbFetch(`/movie/${id}`),
                        tmdbFetch(`/movie/${id}/watch/providers`)
                    ]);
                    const reg = (p.results && p.results[TMDB_REGION]) || {};
                    const names = list => (list || []).map(x => x.provider_name).join(', ');
                    let stream = names(reg.flatrate);
                    if (!stream && reg.rent) stream = 'Hyra: ' + names(reg.rent);
                    if (!stream && reg.buy) stream = 'Köpa: ' + names(reg.buy);
                    selectedMovie = {
                        id: d.id,
                        title: d.title,
                        year: d.release_date ? d.release_date.slice(0, 4) : '',
                        overview: d.overview || 'Ingen handling tillgänglig på svenska.',
                        stream: stream || 'Ingen streaming i Sverige just nu',
                        date: todaySE()
                    };
                    selectedShow = null; selectedSportTeam = null, selectedSchedule = null;
                    modal.style.display = 'none'; render();
                } catch (err) {
                    document.getElementById('modal-search-results').innerHTML = searchMsg('Kunde inte hämta filmdata.');
                }
            } else if (target.closest('.search-click-league')) {
                openSchedule(LEAGUES[Number(target.closest('.search-click-league').dataset.idx)]);
            } else if (target.closest('.fav-toggle')) {
                const btn = target.closest('.fav-toggle');
                let on;
                if (btn.dataset.type === 'team') {
                    const t = selectedSportTeam;
                    const idx = favorites.teams.findIndex(x => String(x.idTeam) === String(t.idTeam));
                    if (idx > -1) favorites.teams.splice(idx, 1); else favorites.teams.push({ idTeam: t.idTeam, strTeam: t.strTeam, strLeague: t.strLeague, strSport: t.strSport, leagueIdx: t.leagueIdx });
                    on = idx === -1;
                } else {
                    const id = String(selectedSchedule.league.id);
                    const idx = favorites.leagues.indexOf(id);
                    if (idx > -1) favorites.leagues.splice(idx, 1); else favorites.leagues.push(id);
                    on = idx === -1;
                }
                saveFavorites();
                btn.classList.toggle('added', on);
                btn.innerHTML = favLabel(on);
            } else if (target.closest('.search-click-sport-team')) {
                const el = target.closest('.search-click-sport-team');
                const teamObj = JSON.parse(decodeURIComponent(el.dataset.teamObj));
                selectedSportTeam = teamObj;
                selectedSchedule = null; selectedShow = null; selectedMovie = null;
                sportShown = 4;
                modal.style.display = 'none';
                document.getElementById('main-container').innerHTML = searchMsg('Hämtar matcher...');
                try { sportTeamEvents = await fetchTeamMatches(teamObj); } catch (err) { sportTeamEvents = []; }
                render();
                window.scrollTo(0, 0);
            } else if (target.closest('.show-more-sport')) {
                sportShown += 4;
                render();
            } else if (target.id === 'back-to-main') {
                selectedShow = null; selectedMovie = null; selectedSportTeam = null, selectedSchedule = null;
                render();
            } else if (target.closest('.watch-toggle')) {
                const btn = target.closest('.watch-toggle');
                const type = btn.dataset.type;
                const item = type === 'series'
                    ? { id: selectedShow.id, name: selectedShow.name, year: (selectedShow.premiered || '').slice(0, 4) }
                    : { id: selectedMovie.id, title: selectedMovie.title, year: selectedMovie.year };
                const list = watchlist[type];
                const idx = list.findIndex(x => String(x.id) === String(item.id));
                if (idx > -1) list.splice(idx, 1); else list.push(item);
                saveWatchlist();
                btn.classList.toggle('added', idx === -1);
                btn.innerHTML = watchLabel(idx === -1);
            } else if (target.closest('.add-season-btn')) {
                const btn = target.closest('.add-season-btn');
                const sNum = Number(btn.dataset.season);
                const eps = showEpisodes.filter(ep => ep.season === sNum);
                const dated = eps.filter(ep => ep.airdate);
                const net = epNetwork();
                if (seasonAllAdded(sNum)) {
                    cal = cal.filter(i => !dated.some(ep => i.t === epTitle(ep) && i.d === ep.airdate));
                } else {
                    dated.forEach(ep => {
                        if (!cal.some(i => i.t === epTitle(ep) && i.d === ep.airdate)) {
                            cal.push({ id: Date.now() + Math.floor(Math.random() * 100000), ic: '📺', k: 'Serie', t: epTitle(ep), s: net, d: ep.airdate });
                        }
                    });
                    const missing = eps.length - dated.length;
                    if (missing > 0) alert(`${missing} avsnitt saknar speldatum och lades inte till.`);
                }
                saveCal();
                // uppdatera knapparna på plats så säsongen förblir uppfälld
                const details = btn.closest('details');
                details.querySelectorAll('.add-cal-btn').forEach(b => {
                    const on = cal.some(i => i.t === b.dataset.title && i.d === b.dataset.date);
                    b.innerHTML = on ? ICON_CHECK : ICON_PLUS;
                    b.classList.toggle('added', on);
                });
                btn.innerHTML = seasonBtnLabel(sNum);
                btn.classList.toggle('added', seasonAllAdded(sNum));
            } else if (target.classList.contains('add-cal-btn')) {
                const t = target.dataset.title, s = target.dataset.sub, d = target.dataset.date, k = target.dataset.kind;
                const existingIndex = cal.findIndex(item => item.t === t && item.d === d);
                if (existingIndex > -1) {
                    cal.splice(existingIndex, 1);
                    saveCal();
                    target.innerHTML = ICON_PLUS;
                    target.classList.remove('added');
                } else {
                    cal.push({ id: Date.now(), ic: '⚽', k, t, s, d });
                    saveCal();
                    target.innerHTML = ICON_CHECK;
                    target.classList.add('added');
                }
            } else if (target.id === 'add-movie-cal-btn') {
                const title = selectedMovie.title;
                const date = document.getElementById('movie-date-input').value;
                const sub = selectedMovie.stream;
                cal.push({ id: Date.now(), ic: '🎬', k: 'Film', t: title, s: sub, d: date });
                selectedMovie = null;
                render();
            }
        });

        document.addEventListener('change', e => {
            if (e.target.classList.contains('dropdown-date-input')) {
                const id = Number(e.target.dataset.id);
                const item = cal.find(i => i.id === id);
                if (item && e.target.value) { item.d = e.target.value; render(); }
            }
        });

        let drag = null, lpTimer = null, touchStart = null, scrollTimer = null, edgeTimer = 0;
        const mc = document.getElementById('main-container');

        function shiftWeek(n) { currentWeekStart.setDate(currentWeekStart.getDate() + n); render(); }

        function startDrag(el, x, y) {
            const id = Number(el.dataset.id);
            const r = el.getBoundingClientRect();
            const ghost = el.cloneNode(true);
            ghost.classList.add('drag-ghost');
            ghost.style.width = r.width + 'px';
            ghost.style.left = r.left + 'px';
            ghost.style.top = r.top + 'px';
            document.body.appendChild(ghost);
            el.classList.add('dragging');
            drag = { id, ghost, offX: x - r.left, offY: y - r.top, dir: 0 };
            if (navigator.vibrate) navigator.vibrate(15);
            scrollTimer = setInterval(() => { if (drag && drag.dir) window.scrollBy(0, drag.dir * 10); }, 16);
        }

        function clearDropMarks() {
            document.querySelectorAll('.day-card.drop-target').forEach(c => c.classList.remove('drop-target'));
            document.querySelectorAll('.item.drop-before, .item.drop-after').forEach(c => c.classList.remove('drop-before', 'drop-after'));
        }

        function getDropTarget(x, y) {
            const under = document.elementFromPoint(x, y);
            const card = under && under.closest('.day-card');
            if (!card) return null;
            const items = [...card.querySelectorAll('.item:not(.dragging)')];
            let before = null;
            for (const el of items) {
                const r = el.getBoundingClientRect();
                if (y < r.top + r.height / 2) { before = el; break; }
            }
            return { card, before, last: items[items.length - 1] || null };
        }

        function moveDrag(x, y) {
            drag.ghost.style.left = (x - drag.offX) + 'px';
            drag.ghost.style.top = (y - drag.offY) + 'px';
            clearDropMarks();
            const tgt = getDropTarget(x, y);
            if (tgt) {
                tgt.card.classList.add('drop-target');
                if (tgt.before) tgt.before.classList.add('drop-before');
                else if (tgt.last) tgt.last.classList.add('drop-after');
            }
            drag.dir = y < 130 ? -1 : (y > window.innerHeight - 110 ? 1 : 0);
            const now = Date.now();
            if ((x < 28 || x > window.innerWidth - 28) && now - edgeTimer > 800) {
                edgeTimer = now;
                shiftWeek(x < 28 ? -7 : 7);
            }
        }

        function cleanupDrag() {
            clearInterval(scrollTimer);
            if (drag) drag.ghost.remove();
            clearDropMarks();
            drag = null;
        }

        function endDrag(x, y) {
            const tgt = getDropTarget(x, y);
            const item = cal.find(i => i.id === drag.id);
            if (tgt && tgt.card.dataset.date && item) {
                const date = tgt.card.dataset.date;
                const beforeId = tgt.before ? Number(tgt.before.dataset.id) : null;
                cal = cal.filter(i => i.id !== item.id);
                item.d = date;
                let idx = -1;
                if (beforeId !== null) idx = cal.findIndex(i => i.id === beforeId);
                else {
                    for (let n = cal.length - 1; n >= 0; n--) if (cal[n].d === date) { idx = n + 1; break; }
                }
                if (idx < 0) cal.push(item); else cal.splice(idx, 0, item);
            }
            cleanupDrag();
            render();
        }

        mc.addEventListener('touchstart', e => {
            const t = e.touches[0];
            touchStart = { x: t.clientX, y: t.clientY };
            const el = e.target.closest('.item');
            if (el && currentTab === 'vecka' && !e.target.closest('.menu-container')) {
                lpTimer = setTimeout(() => startDrag(el, t.clientX, t.clientY), 350);
            }
        }, { passive: true });

        mc.addEventListener('touchmove', e => {
            const t = e.touches[0];
            if (drag) { e.preventDefault(); moveDrag(t.clientX, t.clientY); return; }
            if (touchStart && (Math.abs(t.clientX - touchStart.x) > 8 || Math.abs(t.clientY - touchStart.y) > 8)) clearTimeout(lpTimer);
        }, { passive: false });

        mc.addEventListener('touchend', e => {
            clearTimeout(lpTimer);
            const t = e.changedTouches[0];
            if (drag) { endDrag(t.clientX, t.clientY); touchStart = null; return; }
            if (touchStart && currentTab === 'vecka' && !selectedShow && !selectedMovie && !selectedSportTeam && !selectedSchedule) {
                const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
                if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftWeek(dx < 0 ? 7 : -7);
            }
            touchStart = null;
        });

        mc.addEventListener('touchcancel', () => { clearTimeout(lpTimer); if (drag) { cleanupDrag(); render(); } touchStart = null; });
        mc.addEventListener('contextmenu', e => { if (e.target.closest('.item')) e.preventDefault(); });

        function scrollToToday() {
            const card = document.querySelector('.day-card.is-today');
            if (!card || parseDate(todaySE()).getDay() === 1) { window.scrollTo(0, 0); return; }
            card.scrollIntoView({ block: 'start' });
        }

        window.onload = function() { render(); requestAnimationFrame(scrollToToday); };
    </script>
</body>
</html>
