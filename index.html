<!DOCTYPE html>
<html lang="sv">

    <title>NextWeek</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0b0b0f;
            --c: #16161f;
            --b: #2c2c3a;
            --t: #fff;
            --m: #9a9aae;
            --a: #ff3b30;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
        }
        @media(prefers-color-scheme:light){
            :root:not([data-theme=dark]){--bg:#f3f3f8;--c:#fff;--b:#dcdce6;--t:#111;--m:#666}
        }
        html, body {
            margin: 0;
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--t);
            padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 14px;
            padding: 12px 14px;
            margin: 10px 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .card .g { flex: 1; min-width: 0; }
        .card small { display: block; color: var(--m); }
        .day { border-radius: 12px; padding: 2px 0; min-height: 40px; }
        .day.over { outline: 2px dashed var(--a); }
        h3 { margin: 16px 0 6px; font-size: 13px; color: var(--m); text-transform: uppercase; letter-spacing: 0.5px; }
        .h { color: #ff4d6d; }
        .hd { cursor: grab; touch-action: none; color: var(--m); font-size: 18px; padding-right: 4px; }
        .drag { opacity: .5; }
        .menu { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 10px; }
        .menu button { font-size: 12px; background: var(--c); border: 1px solid var(--b); border-radius: 8px; padding: 6px 10px; color: var(--t); cursor: pointer; }
        .lk { color: #ff3b30; cursor: pointer; text-decoration: none; }
        .lk:hover { text-decoration: underline; }
        details { background: var(--c); border: 1px solid var(--b); border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
        summary { cursor: pointer; padding: 2px 0; font-weight: 600; }
        .ep { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--b); font-size: 14px; }
        .ep span { flex: 1; }
        .note { font-size: 12px; color: var(--m); margin-top: 16px; }
        #sr { position: absolute; left: 16px; right: 16px; top: 70px; background: var(--c); border: 1px solid var(--b); border-radius: 12px; overflow: hidden; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        #sr div { padding: 12px 14px; border-bottom: 1px solid var(--b); cursor: pointer; }
        #sr div:hover { background: rgba(255,255,255,0.03); }
        #sr small, .m { color: var(--m); }
    </style>
</head>

    </nav>
