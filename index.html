<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>NextWeek</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #121824;
            --card-hover: #1a2233;
            --accent: #ff3b30;
            --text-main: #ffffff;
            --text-muted: #9a9aae;
            --border: #2c2c3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background-color: var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        .search-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .search-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        #search-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 10px 16px;
            display: none;
        }

        #search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--accent);
        }

        #sr {
            position: absolute;
            left: 16px;
            right: 16px;
            top: 75px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #sr div {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        #sr div:hover {
            background: rgba(255,255,255,0.03);
        }

        #sr small, .m {
            color: var(--text-muted);
        }

        .day-card, .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .card .g {
            flex: 1;
            min-width: 0;
        }

        .card small {
            display: block;
            color: var(--text-muted);
        }

        .day {
            border-radius: 12px;
            padding: 2px 0;
            min-height: 40px;
        }

        .day.over {
            outline: 2px dashed var(--accent);
        }

        h3 {
            margin: 16px 0 6px;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            width: 100%;
        }

        .day-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .day-title {
            font-size: 15px;
            font-weight: 700;
        }

        .today-badge {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .day-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .add-item-btn {
            background: var(--card-hover);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }

        .add-item-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .item {
            background-color: #161f30;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
            width: 100%;
        }

        .h { color: #ff4d6d; }
        .hd { cursor: grab; touch-action: none; color: var(--text-muted); font-size: 18px; padding-right: 4px; }
        .drag { opacity: .5; }
        
        .menu {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: -4px 0 10px;
        }

        .menu button {
            font-size: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            color: var(--text-main);
            cursor: pointer;
        }

        .lk {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
        }

        .lk:hover {
            text-decoration: underline;
        }

        details {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            margin: 8px 0;
            width: 100%;
        }

        summary {
            cursor: pointer;
            padding: 2px 0;
            font-weight: 600;
        }

        .ep {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 6px 0;
            border-top: 1px solid var(--border);
            font-size: 14px;
        }

        .ep span { flex: 1; }
        .note { font-size: 12px; color: var(--text-muted); margin-top: 16px; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(11, 15, 23, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.on, .nav-item:hover {
            color: var(--accent);
        }

        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">📅</div>
            <div>
                <h1 class="brand-title">NextWeek</h1>
                <span class="brand-sub">Veckoöversikt & Sport</span>
            </div>
        </div>
        <div>
            <button class="search-btn" onclick="toggleSearch()" title="Sök">🔍</button>
        </div>
    </header>

    <div id="search-container">
        <input id="q" placeholder="Sök serie, film, lag, liga…" autocomplete="off">
    </div>
    <div id="sr" hidden></div>

    <div class="container" id="m"></div>

    <nav class="bottom-nav">
        <button class="nav-item" data-a="tab" data-v="week">
            <span class="nav-icon">📅</span>
            <span>Vecka</span>
        </button>
        <button class="nav-item" data-a="tab" data-v="sport">
            <span class="nav-icon">⚽</span>
            <span>Sport</span>
        </button>
        <button class="nav-item" data-a="tab" data-v="fav">
            <span class="nav-icon">❤️</span>
            <span>Favoriter</span>
        </button>
    </nav>

            ['nh','NHL','🏒','Viaplay · V Sport','Rangers,Bruins,Oilers,Maple Leafs,Avalanche,Panthers'],

        const FX = []; const REAL = new Set(['pl']);
        const PLV = 'Viaplay', PRM = 'Prime Video';
        
        [['10-10','13:30','Arsenal','Leeds',PRM],['10-10','16:00','Sunderland','Brighton',PLV],['10-10','16:00','Aston Villa','Brentford',PLV],['10-10','16:00','Chelsea','Bournemouth',PLV],['10-10','16:00','Ipswich','Fulham',PLV],['10-10','18:30','Man United','Tottenham',PLV],
        ['10-11','15:00','Crystal Palace','Nottm Forest',PLV],['10-11','15:00','Hull','Everton',PLV],['10-11','17:30','Liverpool','Man City',PLV],['10-12','21:00','Coventry','Newcastle',PLV]]
        .forEach(x => FX.push({lg:'pl', d:'2026-'+x[0], t:x[1], h:x[2], a:x[3], c:x[4]}));

        LG.forEach(l => {
            if(l[0] == 'pl') return;
            const tm = l[4] ? l[4].split(',') : [];
            if(!tm.length) { ['USA GP','Mexikos GP'].forEach((r,i) => FX.push({lg:l[0], h:r, a:'', d:add(today,3+i*7), t:'21:00'})); return; }

                const s = tm.slice().sort(() => rnd()-.5);

            }
        });
        FX.sort((x,y) => x.d.localeCompare(y.d) || x.t.localeCompare(y.t));
