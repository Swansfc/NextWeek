<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextWeek</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #121824;
            --card-hover: #1a2233;
            --accent: #ff3b30;
            --text-main: #ffffff;
            --text-muted: #9a9aae;
            --border: #2c2c3a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background-color: var(--bg-color);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        
        /* Kalender-ikonen i toppen */
        .custom-logo-icon {
            width: 42px; height: 42px; background: #000; border-radius: 10px;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 6px; position: relative; overflow: hidden; border: 1px solid #222;
        }
        .cli-top { display: flex; justify-content: space-around; width: 100%; }
        .cli-peg { width: 6px; height: 5px; background: #fff; border-radius: 3px; }
        .cli-body { background: #fff; border-radius: 6px; flex: 1; padding: 4px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; position: relative; }
        .cli-dot { background: #ccc; border-radius: 1px; height: 5px; }
        .cli-dot.red { background: var(--accent); }
        .cli-nw { position: absolute; bottom: 2px; right: 3px; font-weight: 900; font-size: 11px; color: var(--accent); font-style: italic; letter-spacing: -0.5px; }

        /* NextWeek typsnittslogotyp */
        .brand-text-logo {
            font-size: 22px; font-weight: 800; font-style: italic; letter-spacing: -0.5px;
            display: flex; align-items: baseline; line-height: 1;
        }
        .brand-text-next { color: #ffffff; }
        .brand-text-week { color: var(--accent); }

        .search-btn {
            background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .container { max-width: 650px; margin: 0 auto; padding: 20px 16px; }

        /* Veckonavigering */
        .week-nav {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--card-bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px 16px; margin-bottom: 20px;
        }
        .week-nav-title { font-size: 14px; font-weight: 600; }
        .nav-arrow-btn {
            background: var(--card-hover); border: 1px solid var(--border); color: var(--text-main);
            width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .nav-arrow-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* Sök-modal */
        #search-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 15, 23, 0.95); backdrop-filter: blur(12px);
            z-index: 200; display: none; flex-direction: column; padding: 20px;
            align-items: center; justify-content: flex-start;
        }
        .search-content-wrapper { max-width: 650px; width: 100%; display: flex; flex-direction: column; height: 100%; }
        .search-header-row { display: flex; gap: 12px; align-items: center; width: 100%; margin-bottom: 20px; }
        #modal-search-input { flex: 1; padding: 14px 18px; background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; color: var(--text-main); outline: none; font-size: 16px; }
        .close-search-btn { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 8px; }

        .search-results-box { width: 100%; overflow-y: auto; flex: 1; padding-bottom: 40px; }

        .day-card, .card {
            background-color: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .day-card { display: block; transition: border-color 0.2s; }
        .day-card.is-today { border-color: rgba(255, 59, 48, 0.6); }

        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .day-title { font-size: 15px; font-weight: 700; }
        .today-badge { background: var(--accent); color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-left: 8px; }
        .day-date { font-size: 12px; color: var(--text-muted); margin-left: 8px; }

        .action-btn {
            background: var(--card-hover); border: 1px solid var(--border); color: var(--text-muted);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
            min-width: 36px; height: 36px;
        }
        .action-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(255, 59, 48, 0.1); }

        /* Kalenderobjekt */
        .item {
            background-color: #161f30; border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; display: flex; align-items: flex-start; justify-content: space-between; margin-top: 8px;
            user-select: none; position: relative;
        }
        .item-content { flex: 1; }
        
        /* Treprickarsmeny */
        .menu-container { position: relative; margin-left: 8px; }
        .menu-dots-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 0 4px; }
        .menu-dots-btn:hover { color: var(--text-main); }
        
        .dropdown-menu {
            display: none; position: absolute; right: 0; top: 24px;
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4); z-index: 50; width: 190px; overflow: hidden;
        }
        .dropdown-menu.show { display: block; }
        
        .dropdown-item {
            padding: 10px 12px; font-size: 13px; color: var(--text-main); background: none; border: none;
            width: 100%; text-align: left; display: block; border-bottom: 1px solid var(--border); cursor: pointer;
        }
        .dropdown-item:last-child { border-bottom: none; color: var(--accent); }
        .dropdown-item:hover { background: var(--card-hover); }

        .dropdown-date-input {
            display: none; width: calc(100% - 20px); margin: 6px 10px 10px 10px;
            padding: 6px; background: var(--bg-color); border: 1px solid var(--border);
            border-radius: 6px; color: white; font-size: 12px; outline: none;
        }
        .dropdown-date-input.show { display: block; }

        .sub-days-menu {
            display: none; background: var(--card-hover); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
        }
        .sub-days-menu.show { display: block; }
        .sub-day-btn {
            padding: 8px 16px; font-size: 12px; color: var(--text-muted); background: none; border: none;
            width: 100%; text-align: left; cursor: pointer; display: block; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .sub-day-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }

        .badge { background: rgba(255, 59, 48, 0.2); color: #ff6b63; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
        .empty-day { color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0; font-style: italic; }

        .lk { color: var(--accent); cursor: pointer; text-decoration: none; border: none; background: none; font-size: 14px; text-align: left; padding: 0; }
        .lk:hover { text-decoration: underline; }

        /* Bottennavigering med dina tre nya ikoner[cite: 5] */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: rgba(11, 15, 23, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100;
        }
        .nav-item { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; cursor: pointer; padding: 4px 16px; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }

        /* CSS-version av dina bottenikoner[cite: 5] */
        .nav-cal { width: 22px; height: 22px; background: #0b0f17; border: 2px solid currentColor; border-radius: 5px; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 3px; }
        .nc-top { display: flex; justify-content: space-between; width: 100%; }
        .nc-peg { width: 3px; height: 3px; background: currentColor; border-radius: 1px; }
        .nc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; flex: 1; background: currentColor; padding: 1px; border-radius: 2px; }
        .nc-cell { background: #0b0f17; border-radius: 1px; }
        .nc-cell.red { background: var(--accent); }

        .nav-ball { width: 22px; height: 22px; border: 2px solid currentColor; border-radius: 50%; position: relative; overflow: hidden; background: #0b0f17; }
        .nb-patch { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; background: var(--accent); clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }

        .nav-heart { width: 22px; height: 20px; position: relative; display: flex; align-items: center; justify-content: center; }
        .nav-heart::before, .nav-heart::after { content: ""; position: absolute; top: 0; width: 12px; height: 18px; border-radius: 10px 10px 0 0; background: currentColor; }
        .nav-heart::before { left: 11px; transform: rotate(-45deg); transform-origin: 0 100%; }
        .nav-heart::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

        h3 { margin: 16px 0 6px; font-size: 13px; color: var(--text-muted); text-transform: uppercase; }
        .round-header { font-size: 14px; font-weight: 700; color: var(--accent); margin: 16px 0 8px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <!-- Kalender-ikonen med NW -->
            <div class="custom-logo-icon">
                <div class="cli-top">
                    <div class="cli-peg"></div>
                    <div class="cli-peg"></div>
                </div>
                <div class="cli-body">
                    <div class="cli-dot"></div>
                    <div class="cli-dot"></div>
                    <div class="cli-dot"></div>
                    <div class="cli-dot"></div>
                    <div class="cli-dot"></div>
                    <div class="cli-dot"></div>
                    <div class="cli-dot red"></div>
                    <div class="cli-dot"></div>
                    <div class="cli-dot"></div>
                    <div class="cli-dot"></div>
                    <div class="cli-dot"></div>
                    <span class="cli-nw">NW</span>
                </div>
            </div>
            <!-- NextWeek typsnittslogotyp -->
            <div class="brand-text-logo">
                <span class="brand-text-next">Next</span><span class="brand-text-week">Week</span>
            </div>
        </div>
        <div>
            <button class="search-btn" id="search-toggle-btn" title="Sök">🔍</button>
        </div>
    </header>

    <!-- Sök-overlay modal -->
    <div id="search-modal">
        <div class="search-content-wrapper" id="search-content-wrapper">
            <div class="search-header-row">
                <input type="text" id="modal-search-input" placeholder="Sök lag, liga, serie eller film (t.ex. Arsenal, Dune)..." autofocus>
                <button class="close-search-btn" id="close-search-modal">Avbryt</button>
            </div>
            <div class="search-results-box" id="modal-search-results">
                <div style="color: var(--text-muted); text-align: center; padding-top: 40px;">Börja skriva för att söka bland sporter, serier och filmer...</div>
            </div>
        </div>
    </div>

    <div class="container" id="main-container"></div>

    <nav class="bottom-nav">
        <button class="nav-item" data-tab="vecka">
            <div class="nav-icon">
                <div class="nav-cal">
                    <div class="nc-top"><div class="nc-peg"></div><div class="nc-peg"></div></div>
                    <div class="nc-grid">
                        <div class="nc-cell"></div><div class="nc-cell"></div><div class="nc-cell"></div>
                        <div class="nc-cell"></div><div class="nc-cell red"></div><div class="nc-cell"></div>
                    </div>
                </div>
            </div>
            <span>Vecka</span>
        </button>
        <button class="nav-item" data-tab="sport">
            <div class="nav-icon">
                <div class="nav-ball">
                    <div class="nb-patch"></div>
                </div>
            </div>
            <span>Sport</span>
        </button>
        <button class="nav-item" data-tab="favoriter">
            <div class="nav-icon">
                <div class="nav-heart"></div>
            </div>
            <span>Favoriter</span>
        </button>
    </nav>

    <script>
        const LG = [
            { id: 'pl', name: 'Premier League', icon: '⚽', tv: 'Viaplay · Prime Video', teams: ['Arsenal', 'Aston Villa', 'Bournemouth', 'Brentford', 'Brighton', 'Chelsea', 'Crystal Palace', 'Everton', 'Fulham', 'Ipswich', 'Leeds', 'Liverpool', 'Man City', 'Man United', 'Newcastle', 'Nottm Forest', 'Sunderland', 'Tottenham'] },
            { id: 'ch', name: 'Championship', icon: '⚽', tv: 'Viaplay', teams: ['Leeds', 'Burnley', 'Sheffield United', 'West Brom', 'Norwich', 'Watford', 'Middlesbrough', 'Coventry', 'Sunderland', 'Hull', 'Stoke', 'Swansea'] },
            { id: 'll', name: 'La Liga', icon: '⚽', tv: 'TV4 Play · TV4 Sport Live', teams: ['Real Madrid', 'Barcelona', 'Atlético Madrid', 'Real Sociedad', 'Athletic Bilbao', 'Villarreal', 'Real Betis', 'Sevilla', 'Valencia', 'Girona'] },
            { id: 'sa', name: 'Serie A', icon: '⚽', tv: 'TV4 Play', teams: ['Inter', 'Milan', 'Juventus', 'Napoli', 'Roma', 'Atalanta', 'Lazio', 'Fiorentina', 'Bologna', 'Torino'] },
            { id: 'al', name: 'Allsvenskan', icon: '⚽', tv: 'C More · TV4', teams: ['Malmö FF', 'AIK', 'Djurgården', 'Hammarby', 'IFK Göteborg', 'Häcken', 'Elfsborg', 'Mjällby', 'IFK Norrköping', 'Kalmar FF'] },
            { id: 'bl', name: 'Bundesliga', icon: '⚽', tv: 'Viaplay', teams: ['Bayern München', 'Dortmund', 'Leverkusen', 'Leipzig', 'Frankfurt', 'Stuttgart', 'Wolfsburg', 'Union Berlin', 'Freiburg', 'Gladbach'] },
            { id: 'nh', name: 'NHL', icon: '🏒', tv: 'Viaplay · V Sport', teams: ['Rangers', 'Bruins', 'Oilers', 'Maple Leafs', 'Avalanche', 'Panthers', 'Golden Knights', 'Lightning', 'Canucks', 'Stars'] },
            { id: 'nf', name: 'NFL', icon: '🏈', tv: 'Viaplay · V Sport', teams: ['Chiefs', 'Eagles', '49ers', 'Cowboys', 'Bills', 'Ravens', 'Lions', 'Bengals', 'Packers', 'Dolphins'] },
            { id: 'nb', name: 'NBA', icon: '🏀', tv: 'Viaplay · V Sport', teams: ['Lakers', 'Celtics', 'Warriors', 'Knicks', 'Nuggets', 'Bucks', 'Suns', 'Mavericks', 'Heat', '76ers'] },
            { id: 'f1', name: 'F1', icon: '🏎️', tv: 'Viaplay · V Sport F1', teams: [] }
        ];

        let FX = [];
        let cal = [{ id: 1, ic: '⚽', t: 'Arsenal – Chelsea', s: 'Prime Video · 13:30', d: '2026-10-10' }];
        let currentTab = 'vecka';
        let activeLeague = null;
        let activeTeam = null;
        let selectedShow = null;
        let showEpisodes = [];
        let selectedMovie = null;

        let currentWeekStart = new Date('2026-10-05');

        function formatDateStr(date) {
            let year = date.getFullYear();
            let month = String(date.getMonth() + 1).padStart(2, '0');
            let day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function fetchLiveSportsData() {
            try {
                const res = await fetch('https://api.openligadb.de/getmatchdata/bl1/2026');
                const data = await res.json();
                if (data && Array.isArray(data) && data.length > 0) {
                    FX = data.map(m => ({
                        lg: 'bl',
                        round: m.group?.groupOrderID || 1,
                        d: m.matchDateTime ? m.matchDateTime.split('T')[0] : '2026-10-10',
                        t: m.matchDateTime ? m.matchDateTime.split('T')[1].substring(0,5) : '15:00',
                        h: m.team1?.teamName || 'Lag 1',
                        a: m.team2?.teamName || 'Lag 2',
                        c: 'Viaplay'
                    }));
                } else {
                    generateFallbackSchedule();
                }
            } catch (e) {
                generateFallbackSchedule();
            }
            render();
        }

        function generateFallbackSchedule() {
            FX = [
                { lg: 'pl', round: 8, d: '2026-10-10', t: '13:30', h: 'Arsenal', a: 'Chelsea', c: 'Prime Video' },
                { lg: 'pl', round: 8, d: '2026-10-10', t: '16:00', h: 'Liverpool', a: 'Man City', c: 'Viaplay' },
                { lg: 'll', round: 9, d: '2026-10-11', t: '21:00', h: 'Real Madrid', a: 'Barcelona', c: 'TV4 Play' },
                { lg: 'al', round: 26, d: '2026-10-12', t: '19:00', h: 'Malmö FF', a: 'AIK', c: 'C More' },
                { lg: 'nh', round: 2, d: '2026-10-10', t: '01:00', h: 'Rangers', a: 'Bruins', c: 'Viaplay' }
            ];
        }

        function render() {
            const container = document.getElementById('main-container');
            container.innerHTML = '';

            if (selectedMovie) {
                container.innerHTML = `
                    <button id="back-to-main" class="lk" style="margin-bottom:12px;">← Tillbaka</button>
                    <h2>🎬 ${selectedMovie.title}</h2>
                    <small style="color:var(--text-muted); display:block; margin-bottom:16px;">${selectedMovie.release_date ? selectedMovie.release_date.substring(0,4) : 'År saknas'}</small>
                    
                    <div class="card" style="display:block;">
                        <h3 style="margin-top:0;">Handling</h3>
                        <p style="font-size:14px; color:var(--text-muted); margin-bottom:16px; line-height:1.4;">${selectedMovie.overview || 'Film.'}</p>
                        
                        <h3 style="margin-top:12px;">Streaming</h3>
                        <div style="font-size:14px; margin: 8px 0 16px; color:var(--text-main);">📺 Tillgänglig via digital hyra/köp eller streaming.</div>

                        <div style="border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-size: 12px; color: var(--text-muted);">Välj datum för kalendern:</label>
                            <div style="display: flex; gap: 8px;">
                                <input type="date" id="movie-date-input" value="2026-10-10" style="padding: 8px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; color: white; outline: none;">
                                <button class="action-btn" id="add-movie-cal-btn" style="background: var(--accent); color: white; border: none;">Lägg till</button>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            if (selectedShow) {
                let seasonsHtml = '';
                const seasons = [...new Set(showEpisodes.map(ep => ep.season))];
                seasons.forEach(sNum => {
                    const eps = showEpisodes.filter(ep => ep.season === sNum);
                    seasonsHtml += `<div class="round-header">Säsong ${sNum}</div>`;
                    seasonsHtml += eps.map(ep => `
                        <div class="card">
                            <div>
                                <div style="font-size:14px; font-weight:600;">S${ep.season}E${ep.number} – ${ep.name}</div>
                                <small style="color:var(--text-muted);">${ep.airdate || 'Datum saknas'} · 📺 ${selectedShow.network || selectedShow.webChannel || 'Streaming'}</small>
                            </div>
                            <button class="action-btn add-cal-btn" data-title="${selectedShow.name}: S${ep.season}E${ep.number} ${ep.name}" data-sub="${selectedShow.network || selectedShow.webChannel || 'Serie'} · ${ep.airdate || 'Tid saknas'}" data-date="${ep.airdate || '2026-10-10'}">➕</button>
                        </div>
                    `).join('');
                });

                container.innerHTML = `
                    <button id="back-to-main" class="lk" style="margin-bottom:12px;">← Tillbaka</button>
                    <h2>📺 ${selectedShow.name}</h2>
                    <small style="color:var(--text-muted); display:block; margin-bottom:16px;">${selectedShow.genres ? selectedShow.genres.join(', ') : ''}</small>
                    ${seasonsHtml}
                `;
                return;
            }

            if (activeTeam) {
                const teamMatches = FX.filter(f => f.h.toLowerCase().includes(activeTeam.toLowerCase()) || f.a.toLowerCase().includes(activeTeam.toLowerCase()));
                container.innerHTML = `
                    <button id="back-to-leagues" class="lk" style="margin-bottom:12px;">← Tillbaka till ligor</button>
                    <h2>⚽ ${activeTeam}</h2>
                    <h3>Matcher</h3>
                    ${teamMatches.length === 0 ? '<div class="card"><div style="color:var(--text-muted);">Inga matcher hittades i det aktuella schemat.</div></div>' : teamMatches.map(m => matchCardHTML(m)).join('')}
                `;
                return;
            }

            if (activeLeague) {
                const league = LG.find(l => l.id === activeLeague);
                const leagueMatches = FX.filter(f => f.lg === activeLeague);
                let teamsHtml = league.teams.length ? `
                    <h3>Alla lag</h3>
                    <div class="card" style="flex-wrap: wrap; gap: 8px;">
                        ${league.teams.map(t => `<button class="action-btn team-sel" data-team="${t}">${t}</button>`).join('')}
                    </div>
                ` : '';

                container.innerHTML = `
                    <button id="back-to-sports" class="lk" style="margin-bottom:12px;">← Tillbaka till sporter</button>
                    <h2>${league.icon} ${league.name}</h2>
                    <small style="color:var(--text-muted); display:block; margin-bottom:16px;">📺 ${league.tv}</small>
                    ${teamsHtml}
                    <h3>Spelschema</h3>
                    ${leagueMatches.length ? leagueMatches.map(m => matchCardHTML(m)).join('') : '<div class="card"><div style="color:var(--text-muted);">Hämtar spelschema...</div></div>'}
                `;
                return;
            }

            if (currentTab === 'vecka') {
                let days = [];
                let dayNames = ["Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lördag", "Söndag"];
                let swedishMonths = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
                
                let curr = new Date(currentWeekStart);
                let todayStr = '2026-10-09';

                for (let i = 0; i < 7; i++) {
                    let dStr = formatDateStr(curr);
                    let dateDisplay = `${curr.getDate()} ${swedishMonths[curr.getMonth()]}.`;
                    days.push({
                        name: dayNames[i],
                        date: dateDisplay,
                        dStr: dStr,
                        isToday: dStr === todayStr
                    });
                    curr.setDate(curr.getDate() + 1);
                }

                let startFormatted = `${days[0].date}`;
                let endFormatted = `${days[6].date}`;

                let weekNavHtml = `
                    <div class="week-nav">
                        <button class="nav-arrow-btn" id="prev-week-btn">←</button>
                        <span class="week-nav-title">Vecka (${startFormatted} – ${endFormatted})</span>
                        <button class="nav-arrow-btn" id="next-week-btn">→</button>
                    </div>
                `;

                container.innerHTML = weekNavHtml;

                days.forEach(day => {
                    const dayItems = cal.filter(item => item.d === day.dStr);
                    let itemsHtml = dayItems.length === 0 
                        ? `<div class="empty-day">Inga aktiviteter</div>` 
                        : dayItems.map(i => `
                            <div class="item" data-id="${i.id}">
                                <div class="item-content">
                                    <div style="font-size: 14px; font-weight: 600; margin-bottom: 4px;">${i.t}</div>
                                    <div style="display: flex; gap: 8px; align-items: center;">
                                        <span class="badge">Aktivitet</span>
                                        <span style="font-size: 12px; color: var(--text-muted);">${i.s}</span>
                                    </div>
                                </div>
                                <div class="menu-container">
                                    <button class="menu-dots-btn" data-menu-id="${i.id}">⋮</button>
                                    <div class="dropdown-menu" id="menu-${i.id}">
                                        <button class="dropdown-item move-tomorrow" data-id="${i.id}">Imorgon</button>
                                        <button class="dropdown-item move-next-week" data-id="${i.id}">Nästa vecka</button>
                                        <button class="dropdown-item trigger-move-menu" data-id="${i.id}">Flytta till dag...</button>
                                        <div class="sub-days-menu" id="sub-days-${i.id}">
                                            ${days.map(d => `<button class="sub-day-btn move-to-specific-date" data-id="${i.id}" data-date="${d.dStr}">${d.name} (${d.date})</button>`).join('')}
                                        </div>
                                        <button class="dropdown-item trigger-date-picker" data-id="${i.id}">Annan dag...</button>
                                        <input type="date" class="dropdown-date-input" id="date-input-${i.id}" data-id="${i.id}" value="${i.d}">
                                        <button class="dropdown-item remove-item" data-id="${i.id}">Ta bort</button>
                                    </div>
                                </div>
                            </div>
                        `).join('');

                    const card = document.createElement('div');
                    card.className = `day-card ${day.isToday ? 'is-today' : ''}`;
                    card.dataset.date = day.dStr;
                    card.innerHTML = `
                        <div class="day-header">
                            <div>
                                <span class="day-title">${day.name}</span>
                                ${day.isToday ? '<span class="today-badge">Idag</span>' : ''}
                                <span class="day-date">${day.date}</span>
                            </div>
                        </div>
                        <div>${itemsHtml}</div>
                    `;
                    container.appendChild(card);
                });
            } else if (currentTab === 'sport') {
                let html = `<h3>Ligor & Sporter</h3>`;
                LG.forEach(l => {
                    html += `
                        <div class="card league-card" data-league="${l.id}" style="cursor:pointer;">
                            <div>
                                <span style="font-weight:600; font-size:15px;">${l.icon} ${l.name}</span>
                                <small style="color:var(--text-muted);">📺 ${l.tv}</small>
                            </div>
                            <span style="color:var(--text-muted);">›</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else if (currentTab === 'favoriter') {
                container.innerHTML = `<h3>Favoriter</h3><div class="card"><div style="color:var(--text-muted);">Inga favoriter tillagda ännu.</div></div>`;
            }

            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === currentTab && !activeLeague && !activeTeam && !selectedShow && !selectedMovie);
            });
        }

            const title = m.a ? `${m.h} – ${m.a}` : m.h;
            return `
                <div class="card">
                    <div>
                        <div style="font-size:14px; font-weight:600;">Omg ${m.round}: ${title}</div>
                        <small style="color:var(--text-muted);">${m.d} kl ${m.t} · 📺 ${m.c}</small>
                    </div>
                    <button class="action-btn add-cal-btn" data-title="${title}" data-sub="Omg ${m.round} · ${m.c} · ${m.t}" data-date="${m.d}">➕</button>
                </div>
            `;
        }

        // Live-sökning
        document.getElementById('modal-search-input').addEventListener('input', async function() {
            const query = this.value.trim().toLowerCase();
            const resultsBox = document.getElementById('modal-search-results');
            
            if (!query) {
                resultsBox.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding-top: 40px;">Börja skriva för att söka...</div>`;
                return;
            }

            let html = '';

            LG.forEach(l => {
                if (l.name.toLowerCase().includes(query)) {
                    html += `<div class="card search-click-league" data-league="${l.id}" style="cursor:pointer;"><span>⚽ [Liga] ${l.name}</span><span style="color:var(--text-muted);">›</span></div>`;
                }
                l.teams.forEach(t => {
                    if (t.toLowerCase().includes(query)) {
                        html += `<div class="card search-click-team" data-team="${t}" style="cursor:pointer;"><span>⚽ [Lag] ${t} (${l.name})</span><span style="color:var(--text-muted);">›</span></div>`;
                    }
                });
            });

            try {
                const showRes = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
                const shows = await showRes.json();
                shows.slice(0, 5).forEach(s => {
                    html += `<div class="card search-click-show" data-id="${s.show.id}" style="cursor:pointer;"><span>📺 [Serie] ${s.show.name}</span><span style="color:var(--text-muted);">›</span></div>`;
                });
            } catch (e) {}

            const sampleMovies = ['Dune', 'Inception', 'Interstellar', 'Dark Matter', 'The Matrix', 'Gladiator', 'Avatar'];

        });

        document.addEventListener('click', async e => {

            if (!target.closest('.menu-container') && !target.classList.contains('dropdown-date-input')) {
                document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            }

                modal.style.display = 'none';
                return;
            }

                e.stopPropagation();
                const menuId = target.dataset.menuId;
                const menu = document.getElementById(`menu-${menuId}`);
                document.querySelectorAll('.dropdown-menu').forEach(m => {
                    if (m !== menu) m.classList.remove('show');
                });
                menu.classList.toggle('show');
            }
            else if (target.classList.contains('move-tomorrow')) {
                const id = Number(target.dataset.id);
                const item = cal.find(i => i.id === id);
                if (item) {
                    let d = new Date(item.d);
                    d.setDate(d.getDate() + 1);
                    item.d = formatDateStr(d);
                    render();
                }
            }
            else if (target.classList.contains('move-next-week')) {
                const id = Number(target.dataset.id);
                const item = cal.find(i => i.id === id);
                if (item) {
                    let d = new Date(item.d);
                    d.setDate(d.getDate() + 7);
                    item.d = formatDateStr(d);
                    render();
                }
            }
            else if (target.classList.contains('trigger-move-menu')) {
                e.stopPropagation();
                const id = target.dataset.id;
                const subMenu = document.getElementById(`sub-days-${id}`);
                subMenu.classList.toggle('show');
            }
            else if (target.classList.contains('move-to-specific-date')) {
                const id = Number(target.dataset.id);
                const newDate = target.dataset.date;
                const item = cal.find(i => i.id === id);
                if (item && newDate) {
                    item.d = newDate;
                    render();
                }
            }
            else if (target.classList.contains('trigger-date-picker')) {
                e.stopPropagation();
                const id = target.dataset.id;
                const dateInput = document.getElementById(`date-input-${id}`);
                dateInput.classList.toggle('show');
                dateInput.focus();
            }

                const id = Number(target.dataset.id);
                cal = cal.filter(item => item.id !== id);
                render();
            }

                selectedShow = null;
                selectedMovie = null;
                render();

                render();
            }

                activeTeam = target.dataset.team;
                render();
            }
            else if (target.id === 'back-to-leagues') {
                activeTeam = null;
                render();
            }
            else if (target.id === 'back-to-sports') {
                activeLeague = null;
                render();
            }
            else if (target.id === 'prev-week-btn') {
                currentWeekStart.setDate(currentWeekStart.getDate() - 7);
                render();
            }
            else if (target.id === 'next-week-btn') {
                currentWeekStart.setDate(currentWeekStart.getDate() + 7);
                render();
            }
            else if (target.id === 'search-toggle-btn') {
                modal.style.display = 'flex';
                document.getElementById('modal-search-input').focus();
            }

            }

                selectedShow = null;
                selectedMovie = null;
                modal.style.display = 'none';
                render();
